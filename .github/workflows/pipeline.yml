name: restoration-pipeline

on:
  schedule:
    - cron: "0 3 * * 1"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-merge:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # PYTHON
      # --------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --------------------------------------------------------
      # DEPENDENCIES
      # --------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------------
      # CHECK SECRETS
      # --------------------------------------------------------

      - name: Check GitHub secrets
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
          GEE_PROJECT: ${{ secrets.GEE_PROJECT }}

        run: |
          if [ -z "$GEE_SERVICE_ACCOUNT_KEY" ]; then
            echo "ERROR: GEE_SERVICE_ACCOUNT_KEY is missing."
            exit 1
          fi

          if [ -z "$GEE_PROJECT" ]; then
            echo "ERROR: GEE_PROJECT is missing."
            exit 1
          fi

          echo "GEE_SERVICE_ACCOUNT_KEY is available."
          echo "GEE_PROJECT is available."

      # --------------------------------------------------------
      # CREATE SERVICE ACCOUNT KEY
      # --------------------------------------------------------

      - name: Create Earth Engine credentials
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}

        run: |
          printf '%s' "$GEE_SERVICE_ACCOUNT_KEY" > "$RUNNER_TEMP/gee-key.json"

          python3 - <<'PY'
          import json
          import os

          path = os.path.join(
              os.environ["RUNNER_TEMP"],
              "gee-key.json"
          )

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          required = [
              "type",
              "project_id",
              "private_key",
              "client_email"
          ]

          missing = [
              key for key in required
              if not data.get(key)
          ]

          if missing:
              raise SystemExit(
                  "Invalid service account JSON. Missing: "
                  + ", ".join(missing)
              )

          print("Earth Engine service-account JSON: OK")
          print("Service account:", data["client_email"])
          print("Project in key:", data["project_id"])
          PY

      # --------------------------------------------------------
      # CONFIGURE EARTH ENGINE ENVIRONMENT
      # --------------------------------------------------------

      - name: Configure Earth Engine environment
        env:
          GEE_PROJECT: ${{ secrets.GEE_PROJECT }}

        run: |
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gee-key.json" >> "$GITHUB_ENV"
          echo "GEE_PROJECT=$GEE_PROJECT" >> "$GITHUB_ENV"

          echo "Earth Engine environment configured."
          echo "GEE_PROJECT is set."
          echo "GOOGLE_APPLICATION_CREDENTIALS is set."

      # --------------------------------------------------------
      # TEST EARTH ENGINE
      # --------------------------------------------------------

      - name: Test Earth Engine authentication
        run: |
          python3 - <<'PY'
          import os
          import ee
          from google.oauth2 import service_account

          project = os.environ["GEE_PROJECT"]
          credentials_path = os.environ["GOOGLE_APPLICATION_CREDENTIALS"]

          print("Project:", project)
          print("Credentials file:", credentials_path)

          if not os.path.isfile(credentials_path):
              raise SystemExit(
                  "ERROR: Earth Engine credentials file does not exist."
              )

          credentials = (
              service_account.Credentials
              .from_service_account_file(
                  credentials_path,
                  scopes=[
                      "https://www.googleapis.com/auth/earthengine",
                      "https://www.googleapis.com/auth/cloud-platform",
                  ],
              )
          )

          ee.Initialize(
              credentials=credentials,
              project=project,
          )

          result = ee.Number(1).getInfo()

          print("Earth Engine authentication: OK")
          print("Earth Engine API access: OK")
          print("Test result:", result)
          PY

      # --------------------------------------------------------
      # RUN PIPELINE
      # --------------------------------------------------------

      - name: Run pipeline
        run: |
          python3 run_pipeline.py

      # --------------------------------------------------------
      # VERIFY OUTPUTS
      # --------------------------------------------------------

      - name: Verify generated outputs
        run: |
          echo "Checking generated files..."

          test -f dashboard/data.json
          test -f data/gee_ndvi_data.csv
          test -f data/gee_trends.csv

          echo "Generated files:"
          ls -lh \
            dashboard/data.json \
            data/gee_ndvi_data.csv \
            data/gee_trends.csv

      # --------------------------------------------------------
      # VALIDATE JSON
      # --------------------------------------------------------

      - name: Validate dashboard JSON
        run: |
          echo "Validating dashboard/data.json..."

          python3 -m json.tool dashboard/data.json > /dev/null

          echo "Checking for Git conflict markers..."

          if grep -nE '^(<<<<<<<|=======|>>>>>>>)' dashboard/data.json; then
            echo "ERROR: Git conflict markers detected in dashboard/data.json."
            exit 1
          fi

          echo "dashboard/data.json is valid."

      # --------------------------------------------------------
      # SHOW CURRENT DATA DATE
      # --------------------------------------------------------

      - name: Report latest imagery date
        run: |
          echo "Latest imagery date:"
          cat data/latest_ndvi_date.txt

      # --------------------------------------------------------
      # COMMIT GENERATED DATA
      # --------------------------------------------------------

      - name: Commit generated data
        run: |
          git config user.name "restoration-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            dashboard/data.json \
            data/gee_ndvi_data.csv \
            data/gee_trends.csv \
            data/latest_ndvi_date.txt

          if git diff --cached --quiet; then
            echo "No data changes detected."
          else
            git commit -m "Automated data refresh"
          fi

      # --------------------------------------------------------
      # SYNCHRONIZE WITH REMOTE
      # --------------------------------------------------------

      - name: Synchronize with main
        run: |
          git fetch origin main

          git rebase origin/main

      # --------------------------------------------------------
      # PUSH
      # --------------------------------------------------------

      - name: Push updated data
        run: |
          git push origin HEAD:main