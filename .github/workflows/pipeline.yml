name: restoration-pipeline

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-merge:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. Set up Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------
      # 4. Check required GitHub secrets
      # --------------------------------------------------
      - name: Check GitHub secrets
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
          GEE_PROJECT: ${{ secrets.GEE_PROJECT }}
        run: |
          if [ -z "$GEE_SERVICE_ACCOUNT_KEY" ]; then
            echo "ERROR: GEE_SERVICE_ACCOUNT_KEY is missing."
            echo "Go to GitHub repository Settings > Secrets and variables > Actions."
            exit 1
          fi

          if [ -z "$GEE_PROJECT" ]; then
            echo "ERROR: GEE_PROJECT is missing."
            echo "Go to GitHub repository Settings > Secrets and variables > Actions."
            exit 1
          fi

          echo "GEE_SERVICE_ACCOUNT_KEY is available."
          echo "GEE_PROJECT is available."

      # --------------------------------------------------
      # 5. Authenticate to Google Earth Engine
      # --------------------------------------------------
      - name: Authenticate to Earth Engine
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
          GEE_PROJECT: ${{ secrets.GEE_PROJECT }}
        run: |
          python - <<'PY'
          import json
          import os
          import ee
          from google.oauth2 import service_account

          key_text = os.environ["GEE_SERVICE_ACCOUNT_KEY"]
          project = os.environ["GEE_PROJECT"]

          # Validate that the secret is actually valid JSON
          try:
              key_data = json.loads(key_text)
          except json.JSONDecodeError as e:
              raise SystemExit(
                  f"GEE_SERVICE_ACCOUNT_KEY is not valid JSON: {e}"
              )

          # Validate required service-account fields
          required_fields = [
              "type",
              "project_id",
              "private_key",
              "client_email",
          ]

          missing = [
              field for field in required_fields
              if field not in key_data
          ]

          if missing:
              raise SystemExit(
                  "GEE_SERVICE_ACCOUNT_KEY is missing fields: "
                  + ", ".join(missing)
              )

          credentials = service_account.Credentials.from_service_account_info(
              key_data,
              scopes=[
                  "https://www.googleapis.com/auth/earthengine",
                  "https://www.googleapis.com/auth/cloud-platform",
              ],
          )

          ee.Initialize(
              credentials=credentials,
              project=project,
          )

          # Lightweight API request to verify access
          ee.Number(1).getInfo()

          print("GEE authentication: OK")
          print("Earth Engine API access: OK")
          PY

      # --------------------------------------------------
      # 6. Run restoration pipeline
      # --------------------------------------------------
      - name: Run pipeline
        env:
          GEE_PROJECT: ${{ secrets.GEE_PROJECT }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gee_key.json
        run: |
          python3 run_pipeline.py

      # --------------------------------------------------
      # 7. Verify generated outputs
      # --------------------------------------------------
      - name: Verify generated outputs
        run: |
          echo "Checking generated files..."

          test -f dashboard/data.json
          test -f data/gee_ndvi_data.csv
          test -f data/gee_trends.csv

          echo ""
          echo "Generated files:"
          ls -lh \
            dashboard/data.json \
            data/gee_ndvi_data.csv \
            data/gee_trends.csv

      # --------------------------------------------------
      # 8. Commit and push updated data
      # --------------------------------------------------
      - name: Commit and push updated data
        run: |
          git config user.name "restoration-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            dashboard/data.json \
            data/gee_ndvi_data.csv \
            data/gee_trends.csv

          if git diff --cached --quiet; then
            echo "No data changes detected."
          else
            git commit -m "Automated data refresh"
            git push origin HEAD:main
          fi
