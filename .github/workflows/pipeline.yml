name: restoration-pipeline

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-merge:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. Set up Python
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ------------------------------------------------------------
      # 3. Install dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------------
      # 4. Authenticate to Google Earth Engine
      # ------------------------------------------------------------
      - name: Authenticate to Earth Engine
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
          GEE_PROJECT: ${{ secrets.GEE_PROJECT }}
        run: |
          echo "Checking Earth Engine configuration..."

          if [ -z "$GEE_SERVICE_ACCOUNT_KEY" ]; then
            echo "ERROR: GEE_SERVICE_ACCOUNT_KEY is empty or unavailable."
            exit 1
          fi

          if [ -z "$GEE_PROJECT" ]; then
            echo "ERROR: GEE_PROJECT is empty or unavailable."
            exit 1
          fi

          printf '%s' "$GEE_SERVICE_ACCOUNT_KEY" > /tmp/gee_key.json

          echo "Validating service account JSON..."

          python3 - <<'PY'
          import json
          import os
          import ee

          key_file = "/tmp/gee_key.json"
          project = os.environ["GEE_PROJECT"]

          with open(key_file, "r", encoding="utf-8") as f:
              key_data = json.load(f)

          client_email = key_data.get("client_email")

          if not client_email:
              raise RuntimeError(
                  "The service account JSON does not contain client_email."
              )

          print("Service account JSON: OK")
          print(f"Service account: {client_email}")
          print(f"GEE project: {project}")

          credentials = ee.ServiceAccountCredentials(
              client_email,
              key_file
          )

          ee.Initialize(
              credentials=credentials,
              project=project
          )

          # Lightweight API request to confirm access.
          ee.Number(1).getInfo()

          print("GEE authentication: OK")
          print("Earth Engine API access: OK")
          PY

      # ------------------------------------------------------------
      # 5. Run restoration pipeline
      # ------------------------------------------------------------
      - name: Run restoration pipeline
        env:
          GEE_PROJECT: ${{ secrets.GEE_PROJECT }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gee_key.json
        run: |
          python3 run_pipeline.py

      # ------------------------------------------------------------
      # 6. Verify generated outputs
      # ------------------------------------------------------------
      - name: Verify generated outputs
        run: |
          echo "Checking generated files..."

          test -f dashboard/data.json
          test -f data/gee_ndvi_data.csv
          test -f data/gee_trends.csv

          echo "Generated files:"
          ls -lh \
            dashboard/data.json \
            data/gee_ndvi_data.csv \
            data/gee_trends.csv

      # ------------------------------------------------------------
      # 7. Commit and push updated data
      # ------------------------------------------------------------
      - name: Commit updated dashboard data
        run: |
          git config user.name "restoration-bot"
          git config user.email "bot@users.noreply.github.com"

          git add \
            dashboard/data.json \
            data/gee_ndvi_data.csv \
            data/gee_trends.csv

          if git diff --cached --quiet; then
            echo "No data changes detected."
          else
            git commit -m "Automated data refresh"
            git push origin main
          fi