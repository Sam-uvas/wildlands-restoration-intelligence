name: restoration-pipeline

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-merge:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check GitHub secrets
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
          GEE_PROJECT: ${{ secrets.GEE_PROJECT }}
        run: |
          if [ -z "$GEE_SERVICE_ACCOUNT_KEY" ]; then
            echo "ERROR: GEE_SERVICE_ACCOUNT_KEY is missing."
            exit 1
          fi

          if [ -z "$GEE_PROJECT" ]; then
            echo "ERROR: GEE_PROJECT is missing."
            exit 1
          fi

          echo "GEE_SERVICE_ACCOUNT_KEY is available."
          echo "GEE_PROJECT is available."

      - name: Create Earth Engine credentials
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
        run: |
          printf '%s' "$GEE_SERVICE_ACCOUNT_KEY" > /tmp/gee_key.json

          python - <<'PY'
          import json

          with open("/tmp/gee_key.json", "r") as f:
              data = json.load(f)

          required = [
              "type",
              "project_id",
              "private_key",
              "client_email"
          ]

          missing = [x for x in required if x not in data]

          if missing:
              raise SystemExit(
                  "Invalid service account JSON. Missing: "
                  + ", ".join(missing)
              )

          print("Earth Engine service-account JSON: OK")
          print("Service account JSON structure: OK")
          PY

      - name: Authenticate to Earth Engine
        env:
          GEE_PROJECT: ${{ secrets.GEE_PROJECT }}
        run: |
          python - <<'PY'
          import ee
          from google.oauth2 import service_account

          project = "${GEE_PROJECT}"

          credentials = service_account.Credentials.from_service_account_file(
              "/tmp/gee_key.json",
              scopes=[
                  "https://www.googleapis.com/auth/earthengine",
                  "https://www.googleapis.com/auth/cloud-platform"
              ]
          )

          ee.Initialize(
              credentials=credentials,
              project=project
          )

          ee.Number(1).getInfo()

          print("GEE authentication: OK")
          print("Earth Engine API access: OK")
          PY

      - name: Run pipeline
        env:
          GEE_PROJECT: ${{ secrets.GEE_PROJECT }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gee_key.json
        run: |
          python3 run_pipeline.py

      - name: Verify generated outputs
        run: |
          echo "Checking generated files..."

          test -f dashboard/data.json
          test -f data/gee_ndvi_data.csv
          test -f data/gee_trends.csv

          echo "Generated files:"
          ls -lh \
            dashboard/data.json \
            data/gee_ndvi_data.csv \
            data/gee_trends.csv

      - name: Commit and push updated dashboard data
        run: |
          git config user.name "restoration-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            dashboard/data.json \
            data/gee_ndvi_data.csv \
            data/gee_trends.csv

          if git diff --cached --quiet; then
            echo "No data changes detected."
          else
            git commit -m "Automated data refresh"
            git push origin HEAD:main

